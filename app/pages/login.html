<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Login</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors legacy obs_templates/login.html: a centered col-md-6 col-lg-4 shadow-lg card
       with a bg-primary header (graduation-cap + "NinjaNerd Login") and side-by-side
       Login / Create Account buttons. Firebase Auth wiring replaces the stub in prompt 07;
       the stub form IDs (nn-login-form / nn-email / nn-password) are kept for the tests. -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
          <div class="card-header bg-primary text-white text-center">
            <h1 class="h3 mb-0"><i class="fas fa-graduation-cap me-2"></i>NinjaNerd Login</h1>
          </div>
          <div class="card-body p-4">
            <form id="nn-login-form" novalidate>
              <div class="mb-3">
                <label for="nn-email" class="form-label">Username (Email)</label>
                <input type="email" class="form-control" id="nn-email" autocomplete="username" required />
              </div>
              <div class="mb-4">
                <label for="nn-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="nn-password" autocomplete="current-password" required />
              </div>
              <div class="row">
                <div class="col-6">
                  <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-1"></i>Login</button>
                </div>
                <div class="col-6">
                  <a id="nn-create-account" class="btn btn-outline-primary w-100" href="/pages/signup.html"><i class="fas fa-user-plus me-1"></i>Create Account</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/auth-state.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    // Prompt-02 stub: no real auth yet. Sign in locally so the shell can be tested.
    // The login gate (flow.js requireLogin) passes ?next= so we can return the
    // student to the Learn/Practice activity they picked. Only same-origin
    // relative paths are honored, to avoid open-redirects.
    function safeNext() {
      var raw = new URLSearchParams(location.search).get('next') || '';
      // Must be a site-relative path ("/...") and not a protocol-relative "//host".
      return (/^\/(?!\/)/).test(raw) ? raw : '/index.html';
    }
    // Preserve next through the Create Account link too.
    var create = document.getElementById('nn-create-account');
    if (create) create.href = '/pages/signup.html?next=' + encodeURIComponent(safeNext());

    document.getElementById('nn-login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('nn-email').value.trim();
      if (!email) { NNToast.show('Enter your email.', 'warning'); return; }
      NNAuth.signIn(email);
      NNToast.show('Signed in (stub).', 'success');
      location.href = safeNext();
    });
  </script>
</body>
</html>
