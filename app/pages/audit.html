<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit - NinjaNerd</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors legacy obs_templates/audit.html: a col-md-10 card, bg-primary header
       ("User Audit" + Back), a search form taking a username (email), then a User Information
       card and an Activity History table capped at 50 rows.

       Forced divergences from legacy, flagged per the working rules:
       - The PAYMENT panel is removed entirely, not left empty. There are no payments on the
         static site and no user_payments collection.
       - Legacy looked a user up by username because the SQLite row was keyed by it. Firestore
         documents are keyed by uid, so this is a where('email','==',...) query over `users` —
         which is why the rules grant admins `list` and not merely `get`.
       - Admin status is read from the requester's own profile document. Legacy hardcoded
         admin@gmail.com (obs_app.py is_admin_user); a static site has no server to mint custom
         claims, so is_admin on users/{uid} is the source, and the rules make it immutable from
         the client.

       This page HIDES itself from non-admins, but that is only cosmetics. The protection is
       the Security Rules: a non-admin's query is refused by Firestore itself. -->
  <main class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="card shadow">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0"><i class="fas fa-search"></i> User Audit</h3>
            <a href="index.html" class="btn btn-light btn-sm">
              <i class="fas fa-arrow-left"></i> Back
            </a>
          </div>

          <div class="card-body">
            <div id="nn-audit-gate" class="text-center text-muted py-5">
              <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
            </div>

            <div id="nn-audit-panel" style="display:none;">
              <form id="nn-audit-form" class="mb-4" novalidate>
                <div class="row">
                  <div class="col-md-8">
                    <label for="nn-audit-email" class="form-label">Username to Audit:</label>
                    <input type="email" class="form-control" id="nn-audit-email"
                           placeholder="Enter username (e.g., user@example.com)" required />
                  </div>
                  <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100" id="nn-audit-run">
                      <i class="fas fa-search me-2"></i>Generate Audit Report
                    </button>
                  </div>
                </div>
              </form>

              <div class="alert alert-info" id="nn-audit-hint" role="alert">
                <i class="fas fa-info-circle me-2"></i>
                Enter a username to generate an audit report including login history and
                activity.
              </div>

              <div id="nn-audit-results"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/audit.js"></script>
</body>
</html>
