<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Lesson</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />

  <style>
    /* The canvas has a fixed drawing size so the lessons can lay out in real coordinates,
       and scales down on narrow screens. CLAUDE.md rule: wide content must never make the
       page scroll sideways. */
    .lesson-stage {
      background: #ffffff;
      display: flex;
      justify-content: center;
      padding: 8px;
    }
    #lessonCanvas {
      border: 1px solid #dee2e6;
      border-radius: 8px;
      width: 100%;
      max-width: 960px;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Modelled on pages/game.html, minus everything a lesson does not have: no start overlay,
       no pause, no restart, no score. The control bar is Reset, Step, and the toggles the
       lesson declares (prompt 20). -->
  <main class="container-fluid py-3">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
              <i id="nn-lesson-icon" class="fas me-2"></i><span id="nn-lesson-name"></span>
            </h4>
            <a id="nn-back-cl" href="index.html" class="btn btn-light btn-sm">
              <i class="fas fa-arrow-left"></i> Back to Control Logic
            </a>
          </div>
          <div class="card-body">
            <p id="nn-lesson-desc" class="text-muted"></p>
            <div class="lesson-stage mb-3">
              <canvas id="lessonCanvas" width="960" height="500"></canvas>
            </div>
            <div class="d-flex flex-wrap align-items-center border-top pt-3">
              <div id="nn-lesson-controls" class="d-flex flex-wrap align-items-center flex-grow-1"></div>
              <div class="ms-auto">
                <button id="nn-step" type="button" class="btn btn-primary btn-sm me-2">
                  <i class="fas fa-forward-step me-1"></i>Step
                </button>
                <button id="nn-reset" type="button" class="btn btn-outline-secondary btn-sm">
                  <i class="fas fa-rotate-left me-1"></i>Reset
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/lesson.js"></script>
</body>
</html>
