<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Practice</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <!-- KaTeX renders the LaTeX in authored maths questions ($2.5 \times 10^{-3}$). Pinned so a
       future release cannot ship itself to users; see app/js/math-render.js. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors legacy obs_templates/exercise.html: radio options + "Submit Answer",
       result-section (Next / Finish), and a right sidebar with an Explanation card
       (bg-warning, shown on wrong answers, above Progress) + a Progress card.
       Forced divergences from legacy (static host, no runtime LLM):
       - The legacy "Hint" card is OMITTED — there is no hint data in the authored content.
       - The grade>=5 Collaboration sidebar/chat is DROPPED (owner, 2026-09-01), not
         deferred: child-to-child messaging is out of scope for launch. -->
  <main class="container-fluid py-4">
    <div id="nn-practice">
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="fas fa-pencil-alt me-2"></i><span id="nn-practice-title">Practice</span></h2>
            <a id="nn-back-explore" href="index.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back to Explore</a>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Question Area -->
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 id="nn-question-counter" class="mb-0">Loading question…</h5>
            </div>
            <div class="card-body">
              <div id="nn-question-content" class="mb-4">
                <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
              </div>

              <div id="nn-answer-section" style="display:none;">
                <label class="form-label">Choose the correct answer:</label>
                <div id="nn-options-container" class="mb-3"></div>
                <div class="d-grid">
                  <button id="nn-submit-btn" class="btn btn-success btn-lg"><i class="fas fa-check me-1"></i>Submit Answer</button>
                </div>
              </div>

              <div id="nn-result-section" style="display:none;" class="mt-3">
                <div id="nn-result-message" class="alert"></div>
                <button id="nn-next-btn" class="btn btn-primary" style="display:none;"><i class="fas fa-arrow-right me-1"></i>Next Question</button>
                <button id="nn-finish-btn" class="btn btn-success" style="display:none;"><i class="fas fa-flag-checkered me-1"></i>Finish Exercise</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Sidebar -->
        <div class="col-lg-4">
          <!-- Explanation card — appears above Progress when an answer is wrong (legacy behavior). -->
          <div id="nn-explanation-card" class="card" style="display:none;">
            <div class="card-header bg-warning text-dark"><h6 class="mb-0"><i class="fas fa-info-circle me-1"></i>Explanation</h6></div>
            <div class="card-body"><div id="nn-explanation-content"></div></div>
          </div>

          <!-- Progress card -->
          <div class="card" id="nn-progress-card">
            <div class="card-header bg-secondary text-white"><h6 class="mb-0"><i class="fas fa-chart-pie me-1"></i>Progress</h6></div>
            <div class="card-body text-center">
              <div class="progress mb-3" style="height:20px;">
                <div id="nn-progress" class="progress-bar bg-success" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p id="nn-progress-text" class="mb-0">Question 0 of 0</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/practice.js"></script>
</body>
</html>
