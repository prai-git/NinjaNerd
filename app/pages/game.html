<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Game</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />

  <!-- Carried over verbatim from obs_templates/games/game_detail.html's inline <style>.
       Kept inline (rather than folded into site.css) so the game player stays a faithful,
       self-contained copy of the legacy page. -->
  <style>
    .game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #87CEEB;
      min-height: 800px;
    }

    #gameCanvas {
      border: 2px solid #333;
    }

    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }

    .game-container #gameCanvas {
      background: #87CEEB;
    }

    .tank-attack-container #gameCanvas {
      background: #ffffff;
    }

    .game-controls {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 10;
      max-width: 380px;
      max-height: 380px;
    }

    .controls-info {
      margin-bottom: 20px;
    }

    .controls-info p {
      margin: 5px 0;
      font-size: 14px;
    }

    /* Tank Attack specific styles */
    .tank-attack-container {
      background: #f0f0f0;
    }

    /* GeoDash specific styles */
    .geodash-container {
      background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
    }

    .geodash-controls {
      max-width: 380px;
    }

    .geodash-controls h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .geodash-controls .controls-info {
      text-align: left;
      margin-bottom: 20px;
    }

    .geodash-controls .controls-info h6 {
      text-align: center;
      margin-bottom: 15px;
      color: #666;
    }

    .geodash-controls .controls-info p {
      color: #555;
      display: flex;
      align-items: center;
    }

    .geodash-controls .controls-info i {
      width: 20px;
      margin-right: 10px;
    }

    .geodash-game-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tank-attack-controls {
      max-width: 400px;
      padding: 30px;
    }

    .tank-attack-controls h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .tank-attack-controls .controls-info {
      text-align: left;
      margin-bottom: 25px;
    }

    .tank-attack-controls .controls-info h6 {
      text-align: center;
      margin-bottom: 15px;
      color: #666;
    }

    .tank-attack-controls .controls-info p {
      color: #555;
      display: flex;
      align-items: center;
    }

    .tank-attack-controls .controls-info i {
      width: 20px;
      margin-right: 10px;
    }

    .tank-attack-game-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tank-attack-game-buttons .btn {
      min-width: 120px;
    }
  </style>
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors obs_templates/games/game_detail.html. The per-slug Jinja branches (icon,
       container/controls modifier class, control list, CSS/JS includes, constructor and
       pause method) are data-driven from js/games-data.js instead. -->
  <main class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <div>
              <h4 class="mb-0"><i id="nn-game-icon" class="fas me-2"></i><span id="nn-game-name"></span></h4>
            </div>
            <div>
              <button id="pauseBtn" class="btn btn-warning btn-sm ms-2">
                <i class="fas fa-pause"></i> Pause
              </button>
              <a id="nn-back-games" href="/index.html" class="btn btn-outline-secondary btn-sm ms-2">
                <i class="fas fa-arrow-left"></i> Back to Games
              </a>
            </div>
          </div>
          <div class="card-body p-0">
            <div id="nn-game-container" class="game-container">
              <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="1200" height="800"></canvas>
                <div id="gameControls" class="game-controls">
                  <h3 id="nn-controls-title"></h3>
                  <div class="controls-info">
                    <h6>Controls:</h6>
                    <div id="nn-controls-list"></div>
                  </div>
                  <div id="nn-game-buttons">
                    <button id="startBtn" class="btn btn-success btn-lg">
                      <i class="fas fa-play"></i> Start Game
                    </button>
                    <button id="restartBtn" class="btn btn-primary btn-lg" style="display: none;">
                      <i class="fas fa-redo"></i> Restart
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/auth-state.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
