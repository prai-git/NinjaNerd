<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Sign up</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors legacy obs_templates/create_account.html: a centered col-md-6 col-lg-4 shadow-lg
       card with a bg-success header (user-plus + "Create New Account"), the Username/Password/
       School Name fields, and stacked Create Account / Back to Login buttons. Static divergence
       (flagged): the legacy 4-digit email verification-code UI (Gmail SMTP) is OMITTED — Firebase
       Auth handles account creation + its own verification email in prompt 07. Stub form IDs
       (nn-signup-form / nn-email / nn-password) are kept for the tests. -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
          <div class="card-header bg-success text-white text-center">
            <h1 class="h3 mb-0"><i class="fas fa-user-plus me-2"></i>Create New Account</h1>
          </div>
          <div class="card-body p-4">
            <form id="nn-signup-form" novalidate>
              <div class="mb-3">
                <label for="nn-email" class="form-label">Username (Email)</label>
                <input type="email" class="form-control" id="nn-email" autocomplete="username" required />
              </div>
              <div class="mb-3">
                <label for="nn-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="nn-password" autocomplete="new-password" required />
              </div>
              <div class="mb-4">
                <label for="nn-school" class="form-label">School Name (Full Name) <small class="text-muted">(Optional)</small></label>
                <input type="text" class="form-control" id="nn-school" placeholder="Enter your school name" />
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success"><i class="fas fa-user-plus me-1"></i>Create Account</button>
                <a class="btn btn-outline-secondary" href="pages/login.html"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    // Prompt-02 stub: account creation is wired to Firebase in prompt 07.
    document.getElementById('nn-signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      NNToast.show('Account creation is coming soon.', 'info');
    });
  </script>
</body>
</html>
