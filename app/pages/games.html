<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Games</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors obs_templates/games/games_list.html: heading + "Back to Topics", then a
       row of col-lg-3/col-md-4/col-sm-6 clickable .topic-card game cards.
       Grade range now matches legacy 1-7 (grade 7 added 2026-09-02); the guard is
       flow.js isValidGrade, not a literal in games.js. -->
  <main class="container-fluid py-4">
    <div id="nn-games">
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-gamepad me-2"></i><span id="nn-games-title">Select a Game</span></h2>
            <a id="nn-back-topics" href="index.html" class="btn btn-light">
              <i class="fas fa-arrow-left me-1"></i>Back to Topics
            </a>
          </div>
        </div>
      </div>
      <div id="nn-games-grid" class="row g-4"></div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/games.js"></script>
</body>
</html>
