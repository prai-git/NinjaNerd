<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statistics - NinjaNerd</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <!-- Mirrors legacy obs_templates/statistics.html: a centered col-md-10 card with a
       bg-primary header ("Statistics for Grade N" + Back), a Chart.js bar chart, and one
       percentage card per topic. Legacy listed five topics (math, english, science, history,
       geography); history and geography are out of scope, so three.

       Percentages are NOT stored. Legacy recomputed them from the history rows on every view
       (obs_app.py:952) and so do we — the statistics document holds only counters. -->
  <main class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="card shadow">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">
              <i class="fas fa-chart-bar"></i> Statistics for Grade <span id="nn-stats-grade">…</span>
            </h3>
            <a href="index.html" class="btn btn-light btn-sm">
              <i class="fas fa-arrow-left"></i> Back
            </a>
          </div>
          <div class="card-body" id="nn-stats-body">
            <div class="text-center text-muted py-5">
              <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth-state.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/layout.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/statistics.js"></script>
</body>
</html>
