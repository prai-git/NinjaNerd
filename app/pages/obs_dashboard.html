<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NinjaNerd — Practice</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <div id="nn-header" data-nn-header></div>

  <main class="container py-5">
    <h1 class="h3 brand-title mb-4"><i class="fas fa-graduation-cap"></i> Choose a Grade</h1>
    <p class="text-muted">Pick a grade to browse its topics, then choose Learn or Practice.</p>
    <!-- Grade cards enter the browse flow (/pages/topics.html?grade=N →
         subtopics → explore → learn/practice). Sign-in is gated at the Learn/Practice step. -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3">
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=1">Grade 1</a></div>
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=2">Grade 2</a></div>
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=3">Grade 3</a></div>
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=4">Grade 4</a></div>
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=5">Grade 5</a></div>
      <div class="col"><a class="card nn-grade-card text-center p-3 text-decoration-none" href="/pages/topics.html?grade=6">Grade 6</a></div>
    </div>
  </main>

  <div id="nn-footer" data-nn-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/auth-state.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/layout.js"></script>
</body>
</html>
