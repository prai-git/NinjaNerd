{% extends "base.html" %}

{% block title %}Privacy Policy - NinjaNerd{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10 col-md-12">
        <!-- Back Button -->
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Back to Payment
            </a>
        </div>
        
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Privacy Policy</h4>
                <p class="mb-0 mt-1"><small>How we protect and use your information</small></p>
            </div>
            <div class="card-body">
                <div class="privacy-content" style="max-height: 600px; overflow-y: auto;">
                    <pre class="text-wrap" style="font-family: inherit; white-space: pre-wrap;">{{ privacy_content }}</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.privacy-content {
    line-height: 1.6;
}
.privacy-content pre {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
}
</style>
{% endblock %}
