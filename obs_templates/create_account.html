{% extends "base.html" %}

{% block title %}Create Account - NinjaNerd{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white text-center">
                <h3><i class="fas fa-user-plus me-2"></i>Create New Account</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="createAccountForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username (Email)</label>
                        <input type="email" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="school_name" class="form-label">School Name (Full Name) <small class="text-muted">(Optional)</small></label>
                        <input type="text" class="form-control" id="school_name" name="school_name" placeholder="Enter your school name">
                    </div>
                    <div class="mb-4">
                        <label for="verification_code" class="form-label">Verification Code</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="verification_code" name="verification_code" 
                                   placeholder="Enter 4-digit code" maxlength="4" pattern="[0-9]{4}" required>
                            <button type="button" class="btn btn-outline-primary" id="sendCodeBtn" disabled>
                                <i class="fas fa-paper-plane me-1"></i>Send Code
                            </button>
                        </div>
                        <div class="form-text">
                            <small id="codeStatus" class="text-muted">Enter your email above, then click "Send Code"</small>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success" id="createAccountBtn" disabled>
                            <i class="fas fa-user-plus me-1"></i>Create Account
                        </button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i>Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const verificationCodeInput = document.getElementById('verification_code');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const createAccountBtn = document.getElementById('createAccountBtn');
    const codeStatus = document.getElementById('codeStatus');
    
    let codeSentTime = null;
    let codeExpiryTime = null;
    let cooldownTimer = null;
    
    // Enable/disable send code button based on email input
    usernameInput.addEventListener('input', function() {
        const email = this.value.trim();
        const isValidEmail = email && email.includes('@') && email.includes('.');
        sendCodeBtn.disabled = !isValidEmail || isInCooldown();
        
        if (isValidEmail && !isInCooldown()) {
            codeStatus.textContent = 'Click "Send Code" to receive verification code';
            codeStatus.className = 'text-muted';
        } else if (!isValidEmail) {
            codeStatus.textContent = 'Enter a valid email address first';
            codeStatus.className = 'text-muted';
        }
        
        updateCreateAccountButton();
    });
    
    // Enable/disable create account button based on all required fields
    function updateCreateAccountButton() {
        const hasUsername = usernameInput.value.trim() !== '';
        const hasPassword = passwordInput.value.trim() !== '';
        const hasValidCode = verificationCodeInput.value.trim().length === 4;
        const isCodeValid = codeExpiryTime && new Date() < codeExpiryTime;
        
        createAccountBtn.disabled = !(hasUsername && hasPassword && hasValidCode && isCodeValid);
    }
    
    passwordInput.addEventListener('input', updateCreateAccountButton);
    verificationCodeInput.addEventListener('input', function() {
        // Only allow digits and limit to 4 characters
        this.value = this.value.replace(/[^0-9]/g, '').substring(0, 4);
        updateCreateAccountButton();
    });
    
    // Check if currently in cooldown period
    function isInCooldown() {
        return codeSentTime && (new Date() - codeSentTime) < 600000; // 10 minutes
    }
    
    // Update countdown display
    function updateCooldownDisplay() {
        if (!codeSentTime) return;
        
        const elapsed = new Date() - codeSentTime;
        const remaining = Math.max(0, 600000 - elapsed); // 10 minutes - elapsed
        
        if (remaining > 0) {
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            codeStatus.textContent = `Code sent! Wait ${minutes}:${seconds.toString().padStart(2, '0')} before requesting another`;
            codeStatus.className = 'text-info';
            sendCodeBtn.disabled = true;
        } else {
            codeSentTime = null;
            codeExpiryTime = null;
            codeStatus.textContent = 'Code expired. Click "Send Code" to get a new one';
            codeStatus.className = 'text-warning';
            sendCodeBtn.disabled = !usernameInput.value.trim().includes('@');
            updateCreateAccountButton();
        }
    }
    
    // Send verification code
    sendCodeBtn.addEventListener('click', function() {
        const email = usernameInput.value.trim();
        
        if (!email || !email.includes('@')) {
            alert('Please enter a valid email address');
            return;
        }
        
        // Disable button and show loading
        sendCodeBtn.disabled = true;
        sendCodeBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Sending...';
        codeStatus.textContent = 'Sending verification code...';
        codeStatus.className = 'text-info';
        
        // Send AJAX request
        fetch('/send_verification_code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                codeSentTime = new Date();
                codeExpiryTime = new Date(codeSentTime.getTime() + 600000); // 10 minutes from now
                codeStatus.textContent = 'Verification code sent to your email!';
                codeStatus.className = 'text-success';
                
                // Start countdown timer
                cooldownTimer = setInterval(updateCooldownDisplay, 1000);
                
                // Focus on verification code input
                verificationCodeInput.focus();
            } else {
                codeStatus.textContent = data.message || 'Failed to send verification code';
                codeStatus.className = 'text-danger';
                sendCodeBtn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            codeStatus.textContent = 'Error sending verification code. Please try again.';
            codeStatus.className = 'text-danger';
            sendCodeBtn.disabled = false;
        })
        .finally(() => {
            sendCodeBtn.innerHTML = '<i class="fas fa-paper-plane me-1"></i>Send Code';
        });
    });
    
    // Form submission validation
    document.getElementById('createAccountForm').addEventListener('submit', function(e) {
        if (!codeExpiryTime || new Date() >= codeExpiryTime) {
            e.preventDefault();
            alert('Verification code has expired. Please request a new code.');
            return false;
        }
        
        if (verificationCodeInput.value.length !== 4) {
            e.preventDefault();
            alert('Please enter a valid 4-digit verification code.');
            return false;
        }
    });
    
    // Check code expiry every second
    setInterval(function() {
        if (codeExpiryTime && new Date() >= codeExpiryTime && cooldownTimer) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            updateCooldownDisplay();
        }
    }, 1000);
});
</script>
{% endblock %}
