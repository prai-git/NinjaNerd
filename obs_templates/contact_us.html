{% extends "base.html" %}

{% block title %}Contact Us - NinjaNerd{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="fas fa-envelope"></i> Contact Us
                    </h3>
                    <a href="{{ url_for('about') }}" class="btn btn-light btn-sm">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                {{ messages[0] }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endif %}
                    {% endwith %}

                    <form id="contactForm" method="POST">
                        <!-- Subject -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject" required>
                        </div>

                        <!-- Content -->
                        <div class="mb-3">
                            <label for="content" class="form-label">Message</label>
                            <textarea class="form-control" id="content" name="content" rows="8" maxlength="300" required></textarea>
                            <div class="form-text">
                                <span id="charCount">0</span>/300 characters
                            </div>
                        </div>

                        <!-- Send Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary" id="sendBtn" disabled>
                                <i class="fas fa-paper-plane"></i> Send Message
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const contentField = document.getElementById('content');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    // Monitor content changes
    contentField.addEventListener('input', function() {
        const length = contentField.value.length;
        charCount.textContent = length;
        
        // Enable send button only if content is not empty
        sendBtn.disabled = length === 0;
        
        // Change color if approaching limit
        if (length > 250) {
            charCount.style.color = 'red';
        } else if (length > 200) {
            charCount.style.color = 'orange';
        } else {
            charCount.style.color = 'inherit';
        }
    });
});
</script>
{% endblock %}
